version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @astrojs/check only supports TypeScript ^5 || ^6
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
